 cfg:(()=>{try{return JSON.parse(localStorage.getItem('lc_gh'))||{}}catch(e){return{}}})(),

    if(r.status===200){sha=r.sha;const rem=norm(r.data);if(rem.ts!==remoteTs){state=rem;remoteTs=rem.ts;replay();changed=true}}
    else if(r.status===404){const tt=await GH.test();if(tt.ok){sha=null;create=true}else throw{status:404}}
    else throw{status:r.status};
    if(changed){cache();emit()}
    if(!pending.length&&!create){stamp();break}
    const n=pending.length;state.ts=Date.now();
    const w=await GH.put(state,sha);
    if(w.status===200||w.status===201){sha=w.sha;remoteTs=state.ts;pending=pending.slice(n);cache();if(pending.length)continue;stamp();break}
    if(w.status===409||w.status===422)continue; /* alguien guardó antes: se vuelve a leer y reaplicar */
    throw{status:w.status};
   }
  }catch(e){fail(e)}
  finally{busy=false;if(again){again=false;setTimeout(sync,300)}}
 }

  if(kind==='list'){const cur=Shop.cur(),ids=new Set(cur.map(i=>i.id));d={v:1,kind:'list',list:cur.map(({id,q,u})=>({id,q,u})),custom:s.custom.filter(c=>ids.has(c.id)),prices:Object.fromEntries(Object.entries(s.prices).filter(([k])=>ids.has(k)))}}

 importData(text,replace){const m=(text||'').match(/LC1:[A-Za-z0-9+\/=]+/);if(!m)return'No encontré un código válido';
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(m[0].slice(4)))))}catch(e){return'El código está incompleto o dañado'}
  if(!d||d.v!==1)return'Código de otra versión';
  Store.mutate(s=>{const map={};
   (d.custom||[]).forEach(c=>{const ex=s.custom.find(x=>x.id===c.id)||s.custom.find(x=>x.c===c.c&&Shop.nm(x.n)===Shop.nm(c.n));if(ex)map[c.id]=ex.id;else s.custom.push(c)});
   const r=id=>map[id]||id;
   const lm={};if(d.kind==='all')(d.lists||[]).forEach(l=>{const ex=s.lists.find(x=>x.id===l.id)||s.lists.find(x=>Shop.nm(x.n)===Shop.nm(l.n));if(ex)lm[l.id]=ex.id;else{s.lists.push({...l});lm[l.id]=l.id}});
   if(replace){s.list=d.kind==='all'?[]:s.list.filter(i=>i.l!==ACTIVE);if(d.kind==='all'){s.favs=[];s.prices={};s.last={};s.hist={}}}
   (d.list||[]).forEach(i=>{const id=r(i.id),L=d.kind==='all'?(lm[i.l]||s.lists[0].id):ACTIVE;if(!s.list.find(x=>x.id===id&&x.l===L))s.list.push({...i,id,l:L})});

 bought:id=>Store.mutate(s=>{s.list=s.list.filter(i=>!(i.id===id&&i.l===ACTIVE));const now=Date.now(),h=s.hist[id]||[];if(!h.length||now-h[h.length-1]>432e5)h.push(now);s.hist[id]=h.slice(-10);s.last[id]=now}),

  return h+'<div class="tools"><button class="add" id="expall">Expandir todo</button><button class="add" id="colall">Compactar todo</button></div>'+View.rows(items,true,!!f)},
 favs(){const s=Store.get();const items=s.favs.map(Shop.byId).filter(Boolean);
  return `<div class="hero" style="background:linear-gradient(135deg,#d99a1e,#a8641a)"><div><b>${items.length}</b><small>habituales</small></div>${items.length?'<button class="wa" id="addall" style="background:#fff;color:#7a4a10">Agregar todos</button>':''}</div>`+(items.length?View.rows(items):'<div class="empty">Marcá ⭐ en el Catálogo los productos que comprás seguido.</div>')},
 rows(items,coll,searching){const s=Store.get();return grouped(items).map(([c,l])=>{const show=!coll||searching||OPEN.has(c);return (coll?`<button class="cat cathead${show?' open':''}" data-cat="${c}"><span>${CATS[c][0]}</span>${CATS[c][1]}<span class="cnt">${l.length}</span><span class="chev">▾</span></button>`:`<div class="cat">${CATS[c][0]} ${CATS[c][1]}</div>`)+(show?l.map(p=>`<div class="row"><button class="ico" data-fav="${esc(p.id)}">${s.favs.includes(p.id)?'⭐':'☆'}</button><div class="n">${esc(p.n)}${s.last[p.id]?`<span>🛍️ ${ago(s.last[p.id])}</span>`:''}</div><button class="add${Shop.inList(p.id)?' on':''}" data-add="${esc(p.id)}">${Shop.inList(p.id)?'En lista ✓':'+ Agregar'}</button></div>`).join(''):'')}).join('')}
};

function fixActive(){const s=Store.get();if(!s.lists.find(l=>l.id===ACTIVE))setActive(s.lists[0].id)}
function render(){fixActive();
 const keep=document.activeElement?.id==='q';
 document.getElementById('app').innerHTML='<header style="padding:0"></header>'+(tab!=='mas'?View.chips():'')+(tab==='lista'&&bulk?View.bulk():View[tab]());
 document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===tab?'on':''}" data-tab="${k}"><i>${i}</i>${l}</button>`).join('');
 document.querySelector('.chip.on')?.scrollIntoView?.({inline:'center',block:'nearest'});
 if(keep){const e=document.getElementById('q');e.focus();e.setSelectionRange(q.length,q.length)}
}
/* ===== EVENTS (delegación) ===== */
window.addEventListener('error',e=>setSync('Error: '+e.message));
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;try{
 if(d.tab){tab=d.tab;render();scrollTo(0,0)}
 else if(d.buy){const it=Shop.inList(d.buy),prev=Store.get().last[d.buy],ph=(Store.get().hist[d.buy]||[]).slice();Shop.bought(d.buy);toast('Comprado ✓',()=>Store.mutate(s=>{s.list.push(it);prev?s.last[d.buy]=prev:delete s.last[d.buy];ph.length?s.hist[d.buy]=ph:delete s.hist[d.buy]}))}
 else if(d.add){Shop.inList(d.add)?Shop.remove(d.add):Shop.add(d.add)}
 else if(d.list){setActive(d.list);render();scrollTo(0,0)}
 else if(t.id==='ls-new'){const n=document.getElementById('nl-n').value.trim(),ic=document.getElementById('nl-i').value.trim()||'📝';if(!n)toast('Escribí un nombre para la lista');else{const id=Shop.addList(n,ic);setActive(id);toast('Lista creada ✓')}}
 else if(d.ld){const l=Store.get().lists.find(x=>x.id===d.ld),n=Store.get().list.filter(i=>i.l===d.ld).length;
  if(Store.get().lists.length<2)toast('Tiene que quedar al menos una lista');
  else if(mas.del!==d.ld){mas.del=d.ld;render();toast(`“${l.n}” se borra con ${n} producto${n===1?'':'s'}. Tocá ❓ para confirmar`)}
  else{mas.del='';Shop.delList(d.ld);toast('Lista borrada')}}
 else if(t.id==='gh-save'){const v=id=>document.getElementById(id).value.trim(),tok=v('gh-t')||GH.cfg.token||'';
  if(!v('gh-o')||!v('gh-r')||!tok)toast('Completá usuario, repositorio y token');
  else{toast('Probando conexión…');Store.connect({owner:v('gh-o'),repo:v('gh-r'),token:tok}).then(err=>{toast(err||'Conectado y sincronizado ✓');render()})}}
 else if(t.id==='gh-off'){Store.disconnect();render();toast('Desconectado: los datos siguen en este celular')}
 else if(t.id==='ex-list'||t.id==='ex-all'){mas.code=Shop.exportData(t.id==='ex-all'?'all':'list');mas.conf=false;render()}
 else if(t.id==='ex-copy'){copyText(mas.code).then(ok=>toast(ok?'Código copiado ✓':'Mantené apretado el texto y copialo'))}
 else if(t.id==='im-merge'||t.id==='im-replace'){const rp=t.id==='im-replace';
  if(rp&&!mas.conf){mas.conf=true;render();toast('Se vaciará tu lista actual. Tocá otra vez para confirmar')}
  else{mas.conf=false;const err=Shop.importData(mas.imp,rp);if(err){render();toast(err)}else{mas.imp='';render();toast(rp?'Lista reemplazada ✓':'Importado y combinado ✓')}}}
 else if(t.id==='bk-open'){bulk={text:'',rows:null};render()}
 else if(t.id==='bk-cancel'){bulk=null;render()}
 else if(t.id==='bk-back'){bulk.rows=null;render()}
 else if(t.id==='bk-review'){const r=Shop.parse(bulk.text);if(!r.length)toast('Escribí al menos un producto');else{bulk.rows=r;render();scrollTo(0,0)}}
 else if(t.id==='bk-ok'){const es=bulk.rows.filter(r=>r.pick&&r.pick!=='omit').map(r=>r.pick.startsWith('new:')?{name:r.term,cat:r.pick.slice(4),q:r.q,u:r.u}:{id:r.pick,q:r.q,u:r.u});
  const sin=bulk.rows.filter(r=>!r.pick).length;
  if(sin){toast('Elegí una categoría u “Omitir” para los productos nuevos');}else{bulk=null;Shop.addMany(es);toast(es.length+' productos agregados')}}
 else if(d.del){const it=Shop.inList(d.del);Shop.remove(d.del);toast('Quitado de la lista',()=>Store.mutate(s=>{if(!s.list.find(i=>i.id===it.id))s.list.push(it)}))}
 else if(d.inc)Shop.stepQ(d.inc,1)
 else if(d.dec)Shop.stepQ(d.dec,-1)
 else if(d.cat){OPEN.has(d.cat)?OPEN.delete(d.cat):OPEN.add(d.cat);saveOpen();render()}
 else if(t.id==='expall'){Object.keys(CATS).forEach(c=>OPEN.add(c));saveOpen();render()}
 else if(t.id==='colall'){OPEN.clear();saveOpen();render()}
 else if(d.fav)Shop.fav(d.fav);
 else if(t.id==='mk'){const id=Shop.newProduct(q.trim(),document.getElementById('newc').value);Shop.add(id);q='';toast('Producto creado y agregado')}
 else if(t.id==='addall'){Store.get().favs.forEach(Shop.add);toast('Favoritos agregados')}}catch(err){setSync('Error: '+err.message)}});
document.addEventListener('change',e=>{const d=e.target.dataset,v=parseFloat(e.target.value)||0;
 if(d.q)Shop.set(d.q,'q',v||1);else if(d.u)Shop.set(d.u,'u',e.target.value);else if(d.p)Shop.price(d.p,v);else if(d.br!==undefined)bulk.rows[+d.br].pick=e.target.value;else if(d.mv&&e.target.value){Shop.move(d.mv,e.target.value);toast('Movido ✓')}else if(d.ln)Shop.renameList(d.ln,e.target.value);else if(d.li)Shop.iconList(d.li,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}else if(e.target.id==='bt')bulk.text=e.target.value;else if(e.target.id==='imp')mas.imp=e.target.value});

Store.on(()=>{if(!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement.id==='q')render()});
render();Store.init();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
